[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorarray-app"
version = "0.2.0"
description = "SensorArray b41 real-time matrix host application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dash>=2.14",
  "plotly>=5.18",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyserial>=3.5",
  "bleak>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
sensorarray-app = "sensorarray_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "matrix_log_viewer"]
include = ["sensorarray_app*", "matrix_log_viewer*"]

[tool.setuptools.package-data]
sensorarray_app = ["ui/assets/*.css", "ui/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "matrix_log_viewer"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "matrix_log_viewer"]
extend-exclude = ["cap_percent_heatmap.py"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
