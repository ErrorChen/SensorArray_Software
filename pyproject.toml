[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorarray-software"
version = "0.3.0"
description = "SensorArray FastAPI backend and Electron desktop host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyserial>=3.5",
  "bleak>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "httpx2>=0.28",
]

[project.scripts]
sensorarray-backend = "sensorarray_backend.main:main"
sensorarray-app = "sensorarray_backend.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sensorarray_backend*", "sensorarray_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
